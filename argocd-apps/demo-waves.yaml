apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-waves
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JovanAntic/argocd-gitops-demo
    targetRevision: HEAD
    path: applications/demo-waves
  destination:
    server: https://kubernetes.default.svc
    namespace: waves-demo
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
