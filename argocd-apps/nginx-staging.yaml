apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-staging
  namespace: argocd
  annotations:
    # Više notifications nego u dev
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: argocd-prod
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-prod
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argocd-prod
spec:
  project: default
  source:
    repoURL: https://github.com/JovanAntic/argocd-gitops-demo
    targetRevision: HEAD
    path: environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
