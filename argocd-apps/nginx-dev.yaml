apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-dev
  namespace: argocd
  annotations:
    # Subscribuj se na notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-prod
    notifications.argoproj.io/subscribe.on-deployed.slack: argocd-prod
spec:
  project: default
  source:
    repoURL: https://github.com/JovanAntic/argocd-gitops-demo
    targetRevision: HEAD
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
