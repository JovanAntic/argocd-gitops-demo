apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-kustomize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JovanAntic/argocd-gitops-demo
    targetRevision: HEAD
    path: applications/demo-app-kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: grade-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
