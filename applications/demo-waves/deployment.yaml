apiVersion: apps/v1
kind: Deployment
metadata:
  name: waves-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waves-app
  template:
    metadata:
      labels:
        app: waves-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
